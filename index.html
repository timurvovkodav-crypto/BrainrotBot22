<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brainrot Cases</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #111827, #241044);
    color: white;
    min-height: 100vh;
}

header {
    padding: 20px;
    text-align: center;
    background: rgba(0,0,0,0.35);
    font-size: 28px;
    font-weight: bold;
}

.balance {
    text-align: center;
    margin: 25px 0;
    font-size: 22px;
}

.container {
    max-width: 500px;
    margin: auto;
    padding: 20px;
}

.case {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 25px;
    padding: 30px 20px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(0,0,0,0.35);
}

.case-icon {
    font-size: 90px;
    margin: 10px;
}

.case h2 {
    font-size: 28px;
    margin: 10px;
}

.case p {
    color: #bbb;
}

button {
    border: 0;
    border-radius: 14px;
    padding: 15px 35px;
    font-size: 18px;
    font-weight: bold;
    background: #ffd21c;
    color: #111;
    cursor: pointer;
}

button:active {
    transform: scale(0.95);
}

.result {
    margin-top: 25px;
    min-height: 70px;
    font-size: 22px;
    font-weight: bold;
}

.collection {
    margin-top: 25px;
    background: rgba(255,255,255,0.06);
    border-radius: 20px;
    padding: 20px;
}

.collection h2 {
    margin-top: 0;
}

.item {
    padding: 12px;
    margin: 8px 0;
    background: rgba(255,255,255,0.08);
    border-radius: 12px;
}
</style>
</head>

<body>

<header>
🧠 BRAINROT CASES
</header>

<div class="balance">
💰 Монеты: <span id="coins">1000</span>
</div>
